name: Snake eating contributions

on:
  schedule:
    - cron: "37 6 * * *"   # una vez al día
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#ff2a6d
            dist/snake-dark.svg?palette=github-dark&color_snake=#05d9e8&color_dots=#1a0633,#5b1a6e,#ff2a6d,#f9f002,#05d9e8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
