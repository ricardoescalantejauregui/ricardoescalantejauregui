<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 56" width="1000" height="56" shape-rendering="crispEdges">
  <defs>
    <style>
      .blink { animation: b 1.2s steps(1) infinite; }
      @keyframes b { 50% { opacity: .25; } }
    </style>
    <!-- floppy disk -->
    <g id="floppy">
      <rect x="0" y="0" width="32" height="32" fill="#05d9e8"/>
      <rect x="6" y="0" width="18" height="10" fill="#d1f7ff"/>
      <rect x="18" y="2" width="4" height="6" fill="#05d9e8"/>
      <rect x="5" y="16" width="22" height="14" fill="#ffffff"/>
      <rect x="8" y="20" width="16" height="2" fill="#ff2a6d"/>
      <rect x="8" y="24" width="12" height="2" fill="#ff2a6d"/>
    </g>
    <!-- cassette -->
    <g id="cassette">
      <rect x="0" y="4" width="44" height="28" fill="#ff2a6d"/>
      <rect x="4" y="8" width="36" height="12" fill="#1a0633"/>
      <rect x="8" y="11" width="6" height="6" fill="#ffffff"/>
      <rect x="30" y="11" width="6" height="6" fill="#ffffff"/>
      <rect x="16" y="13" width="12" height="2" fill="#f9f002"/>
      <rect x="10" y="24" width="24" height="8" fill="#5b1a6e"/>
    </g>
    <!-- CRT tv -->
    <g id="crt">
      <rect x="0" y="2" width="40" height="30" fill="#8a8aa3"/>
      <rect x="4" y="6" width="26" height="22" fill="#05d9e8"/>
      <rect x="6" y="10" width="22" height="2" fill="#d1f7ff"/>
      <rect x="6" y="16" width="16" height="2" fill="#d1f7ff"/>
      <rect x="33" y="8" width="4" height="4" fill="#ff2a6d"/>
      <rect x="33" y="16" width="4" height="4" fill="#f9f002"/>
      <rect x="10" y="32" width="4" height="4" fill="#8a8aa3"/>
      <rect x="26" y="32" width="4" height="4" fill="#8a8aa3"/>
    </g>
    <!-- joystick -->
    <g id="joy">
      <rect x="12" y="0" width="10" height="10" fill="#ff2a6d"/>
      <rect x="15" y="10" width="4" height="12" fill="#d1f7ff"/>
      <rect x="0" y="22" width="34" height="12" fill="#261447"/>
      <rect x="2" y="24" width="30" height="8" fill="#5b1a6e"/>
      <rect x="25" y="18" width="6" height="4" fill="#f9f002"/>
    </g>
    <!-- heart -->
    <g id="heart">
      <rect x="3" y="0" width="6" height="3" fill="#ff2a6d"/>
      <rect x="15" y="0" width="6" height="3" fill="#ff2a6d"/>
      <rect x="0" y="3" width="24" height="9" fill="#ff2a6d"/>
      <rect x="3" y="12" width="18" height="3" fill="#ff2a6d"/>
      <rect x="6" y="15" width="12" height="3" fill="#ff2a6d"/>
      <rect x="9" y="18" width="6" height="3" fill="#ff2a6d"/>
      <rect x="3" y="3" width="3" height="3" fill="#ffffff"/>
    </g>
    <!-- coin -->
    <g id="coin">
      <rect x="4" y="0" width="12" height="4" fill="#f9f002"/>
      <rect x="0" y="4" width="20" height="16" fill="#f9f002"/>
      <rect x="4" y="20" width="12" height="4" fill="#f9f002"/>
      <rect x="8" y="4" width="4" height="16" fill="#ffb800"/>
    </g>
  </defs>

  <rect x="0" y="27" width="1000" height="2" fill="#ff2a6d" opacity=".55"/>
  <use href="#heart" x="40" y="18" class="blink"/>
  <use href="#coin" x="120" y="16"/>
  <use href="#floppy" x="200" y="12"/>
  <use href="#coin" x="290" y="16"/>
  <use href="#cassette" x="360" y="10"/>
  <use href="#coin" x="460" y="16"/>
  <use href="#crt" x="530" y="8"/>
  <use href="#coin" x="630" y="16"/>
  <use href="#joy" x="700" y="10"/>
  <use href="#coin" x="790" y="16"/>
  <use href="#floppy" x="860" y="12"/>
  <use href="#heart" x="940" y="18" class="blink" style="animation-delay:.6s"/>
</svg>
